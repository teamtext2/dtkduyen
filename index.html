
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>dtkduyen</title>
  <meta name="description" content="CV Đoàn Thị Kỳ Duyên">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;

      /* Ẩn thanh cuộn nhưng vẫn cho phép cuộn */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* CV full trang */
    .cv-container {
      width: 100%;
      margin: 0;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .cv-container.visible {
      opacity: 1;
    }

    .cv-frame {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 337.5%;
      overflow: hidden;
      background: #fff;
    }

    .cv-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.65s ease,
        visibility 0.65s ease;
    }

    .loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      width: 100%;
      max-width: 360px;
      text-align: center;
      animation: appear 0.9s ease both;
    }

    .name {
      margin: 0;
      color: #171717;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 5.5vw, 30px);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .separator {
      width: 32px;
      height: 1px;
      margin: 27px auto;
      background: #d2d2d2;
    }

    .loading-label {
      margin: 0 0 14px;
      color: #888;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .progress-track {
      width: 140px;
      height: 2px;
      margin: 0 auto;
      overflow: hidden;
      background: #ededed;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: #171717;
      animation: loading 1.2s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(360%);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 360px) {
      .name {
        font-size: 18px;
        letter-spacing: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div class="loading-screen" id="loading">
    <div class="loading-content">
      <h1 class="name">ĐOÀN THỊ KỲ DUYÊN</h1>

      <div class="separator"></div>

      <p class="loading-label">Đang tải hồ sơ</p>

      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- CV Canva -->
  <main class="cv-container" id="cv">
    <div class="cv-frame">
      <iframe
        src="https://www.canva.com/design/DAHYvzPuCqc/xiNur278YXPTg9A2L5PlZg/view?embed"
        title="CV Đoàn Thị Kỳ Duyên"
        loading="eager"
        allowfullscreen
        allow="fullscreen"
      ></iframe>
    </div>
  </main>

  <script>
    (() => {
      const loading = document.getElementById("loading");
      const cv = document.getElementById("cv");

      let finished = false;

      function showCV() {
        if (finished) return;
        finished = true;

        cv.classList.add("visible");
        loading.classList.add("hide");

        setTimeout(() => {
          loading.remove();
        }, 700);
      }

      window.addEventListener("load", () => {
        setTimeout(showCV, 1200);
      });

      // Dự phòng khi tài nguyên tải chậm.
      setTimeout(showCV, 4000);
    })();
  </script>

</body>
</html>
```
